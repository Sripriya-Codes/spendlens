name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run test
      - run: npm run build
    env:
      VITE_GROQ_KEY: ${{ secrets.VITE_GROQ_KEY }}
      VITE_NEON_URL: ${{ secrets.VITE_NEON_URL }}
